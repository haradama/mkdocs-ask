name: Release

# Publishes to PyPI when a version tag is pushed. Uses PyPI trusted publishing, so no token is
# stored anywhere: PyPI is told once that this repository and workflow may publish the project,
# and GitHub proves the claim with an OIDC token at run time.
#
# One-time setup, on pypi.org under the project (or as a "pending publisher" before the first
# upload): Publishing -> Add a new publisher -> owner "haradama", repository "mkdocs-ask",
# workflow "release.yml", environment "pypi".
#
# To release: bump `version` in pyproject.toml, move the Unreleased notes in CHANGELOG.md under
# the new version, commit, then `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: The tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
          echo "releasing $version"

      - name: The changelog must have an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$version]' section" >&2
            exit 1
          }

      - run: uv build

      - name: The artifacts must carry the runtime, the entry point and the license
        run: |
          uv run --no-project python - <<'PY'
          import glob, tarfile, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assets = sorted(n.split("/")[-1] for n in names if "/assets/" in n and not n.endswith("/"))
          assert assets == [
              "ask.css", "ask.js", "generator.js", "search-core.js",
              "searchbox.js", "urls.js", "worker.js",
          ], assets
          text = zipfile.ZipFile(wheel).read(next(n for n in names if n.endswith("entry_points.txt"))).decode()
          assert "ask = mkdocs_ask.plugin:AskPlugin" in text, text
          assert any(n.upper().endswith("LICENSE") for n in names), "LICENSE missing from wheel"
          sdist = sorted(glob.glob("dist/*.tar.gz"))[-1]
          members = tarfile.open(sdist).getnames()
          assert any(m.endswith("/LICENSE") for m in members), "LICENSE missing from sdist"
          print(f"{wheel} and {sdist} verified")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mkdocs-ask/
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
